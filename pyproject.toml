[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
dynamic = ["version"]
description = "Static analysis for reliability, cost, and security bugs in AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Samarth" }]
dependencies = [
    "libcst>=1.6,<2",
    "pluggy>=1.5,<2",
    "pydantic>=2,<3",
    "rich>=13,<15",
    "tomli>=2,<3; python_version < '3.11'",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "hypothesis>=6,<7",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[project.entry-points.agentguard]
langgraph = "agentguard_langgraph:Plugin"
graph = "agentguard_graph:Plugin"
owasp = "agentguard_owasp:Plugin"
llm_triage = "agentguard_llm_triage:Plugin"
trace = "agentguard_trace:Plugin"

[tool.uv.workspace]
members = ["packages/agentguard-server"]

[tool.hatch.version]
path = "packages/agentguard-core/src/agentguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/agentguard-core/src/agentguard",
    "packages/agentguard-langgraph/src/agentguard_langgraph",
    "packages/agentguard-graph/src/agentguard_graph",
    "packages/agentguard-owasp/src/agentguard_owasp",
    "packages/agentguard-llm-triage/src/agentguard_llm_triage",
    "packages/agentguard-trace/src/agentguard_trace",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [
    "packages/agentguard-core/src",
    "packages/agentguard-langgraph/src",
    "packages/agentguard-graph/src",
    "packages/agentguard-owasp/src",
    "packages/agentguard-llm-triage/src",
    "packages/agentguard-trace/src",
    "packages/agentguard-server/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agentguard"]

[tool.ruff.format]
# Specification snippets are design sketches, not executable Python.
exclude = ["*.md"]

[tool.mypy]
files = [
    "packages/agentguard-core/src/agentguard",
    "packages/agentguard-langgraph/src",
    "packages/agentguard-graph/src",
    "packages/agentguard-owasp/src",
    "packages/agentguard-llm-triage/src",
    "packages/agentguard-trace/src",
    "packages/agentguard-server/src",
    "tests",
]
exclude = "(^|/)tests/fixtures/"
mypy_path = [
    "packages/agentguard-core/src",
    "packages/agentguard-langgraph/src",
    "packages/agentguard-graph/src",
    "packages/agentguard-owasp/src",
    "packages/agentguard-llm-triage/src",
    "packages/agentguard-trace/src",
    "packages/agentguard-server/src",
]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
