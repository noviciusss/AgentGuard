[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
dynamic = ["version"]
description = "Static analysis for reliability, cost, and security bugs in AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Samarth" }]
dependencies = [
    "pluggy>=1.5,<2",
    "pydantic>=2,<3",
    "rich>=13,<15",
    "tomli>=2,<3; python_version < '3.11'",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[project.entry-points.agentguard]
langgraph = "agentguard_langgraph:Plugin"

[tool.hatch.version]
path = "packages/agentguard-core/src/agentguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/agentguard-core/src/agentguard",
    "packages/agentguard-langgraph/src/agentguard_langgraph",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["packages/agentguard-core/src", "packages/agentguard-langgraph/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agentguard"]

[tool.ruff.format]
# Specification snippets are design sketches, not executable Python.
exclude = ["*.md"]

[tool.mypy]
files = ["packages/agentguard-core/src/agentguard", "packages/agentguard-langgraph/src", "tests"]
exclude = "(^|/)tests/fixtures/"
mypy_path = ["packages/agentguard-core/src", "packages/agentguard-langgraph/src"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
