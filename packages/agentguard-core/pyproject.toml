[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard-core"
version = "0.1.0"
description = "Framework-neutral AgentGuard engine and plugin contracts"
requires-python = ">=3.10"
dependencies = [
    "pluggy>=1.5,<2",
    "pydantic>=2,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
]
