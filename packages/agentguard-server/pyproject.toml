[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard-server"
version = "0.1.0"
description = "FastAPI and PostgreSQL scan history service for AgentGuard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
agentguard-server = "agentguard_server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
